schema_version: 1
random_seed: 699
primary_horizon_years: 1
candidate_horizons_years: [1, 3, 5]
split_strategy: expanding_window
baselines:
  - zero_change
  - historical_average
  - persistence
  - regional_trend
  - regularized_linear
candidate_model: gradient_boosted_trees
primary_metric: mae
secondary_metrics:
  - rmse
  - median_absolute_error
  - directional_accuracy
  - interval_coverage
  - interval_width
