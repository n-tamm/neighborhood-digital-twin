# AI Assistance:
# OpenAI ChatGPT was used for code debugging, code generation, code/repo organization,
# and code methodological brainstorming. All final modeling, implementation,
# validation, commentary, and interpretation were performed and verified by the authors.
# Model used: GPT-5

bundle:
  name: neighborhood-digital-twin
  databricks_cli_version: ">= 0.218.0"

variables:
  catalog:
    description: Existing Unity Catalog catalog used by the project
    default: workspace
  schema:
    description: Shared development schema for pipeline tables
    default: neighborhood_twin_dev
  volume:
    description: Managed volume for immutable source snapshots
    default: source_snapshots
  acs_release_year:
    description: ACS five-year release used by the feasibility run
    default: "2024"
  pilot_state_fips:
    description: Comma-separated state FIPS codes used by the feasibility run
    default: "04,26,42"
  historical_acs_release_years:
    description: Reviewed ACS releases acquired by one bounded historical run
    default: "2014,2019"
  historical_acs_maximum_requests:
    description: Safety limit for state-by-release API calls in one historical run
    default: "25"
  secret_scope:
    description: Databricks secret scope containing the Census API key
    default: neighborhood-twin
  census_secret_key:
    description: Secret name for the Census API key
    default: census-api-key
  quality_table:
    description: Persisted bronze profiling metrics
    default: bronze_quality_metrics
  silver_fhfa_table:
    description: Standardized current FHFA tract-year table
    default: silver_fhfa_tract_year
  silver_acs_table:
    description: Generated wide ACS tract-release convenience table
    default: silver_acs_tract_year
  silver_acs_measure_table:
    description: Primary normalized ACS tract-release-measure table
    default: silver_acs_tract_measure
  silver_acs_dictionary_table:
    description: Governed ACS measure data dictionary
    default: silver_acs_measure_dictionary
  silver_quality_table:
    description: Persisted silver build metrics
    default: silver_quality_metrics
  tract_relationship_table:
    description: Typed 2010-to-2020 Census tract relationship table
    default: silver_tract_relationship_2010_2020
  geography_quality_table:
    description: Persisted geography validation and coverage metrics
    default: geography_quality_metrics
  tract_display_geometry_table:
    description: Simplified 2020 tract geometry for application maps
    default: silver_tract_display_geometry_2020
  canonical_tract_table:
    description: Complete relationship-defined 2020 tract dimension
    default: silver_canonical_tract_2020
  canonical_quality_table:
    description: Persisted canonical geography validation metrics
    default: canonical_geography_quality_metrics

resources:
  jobs:
    core_source_ingestion:
      name: Neighborhood Digital Twin - Core Source Ingestion
      description: Ingests the initial FHFA, Census geography, and ACS feasibility sources.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: ingest_core_sources
          notebook_task:
            notebook_path: ./notebooks/01_feasibility/01_ingest_core_sources.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              acs_release_year: ${var.acs_release_year}
              pilot_state_fips: ${var.pilot_state_fips}
              secret_scope: ${var.secret_scope}
              census_secret_key: ${var.census_secret_key}
              uploaded_source_directory: ""
        - task_key: profile_bronze_sources
          depends_on:
            - task_key: ingest_core_sources
          notebook_task:
            notebook_path: ./notebooks/02_data_quality/01_profile_bronze_sources.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              quality_table: ${var.quality_table}
    silver_source_transforms:
      name: Neighborhood Digital Twin - Silver Source Tables
      description: Builds validated source-specific silver tables from accepted bronze data.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: build_silver_source_tables
          notebook_task:
            notebook_path: ./notebooks/03_transformation/01_build_silver_source_tables.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              fhfa_table: ${var.silver_fhfa_table}
              acs_table: ${var.silver_acs_table}
              acs_measure_table: ${var.silver_acs_measure_table}
              acs_dictionary_table: ${var.silver_acs_dictionary_table}
              quality_table: ${var.silver_quality_table}
    historical_acs_ingestion:
      name: Neighborhood Digital Twin - Historical ACS Ingestion
      description: Acquires a bounded state-by-release batch into the shared ACS bronze table.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: ingest_historical_acs
          notebook_task:
            notebook_path: ./notebooks/01_feasibility/02_ingest_historical_acs.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              acs_release_years: ${var.historical_acs_release_years}
              state_fips_codes: ${var.pilot_state_fips}
              maximum_requests: ${var.historical_acs_maximum_requests}
              secret_scope: ${var.secret_scope}
              census_secret_key: ${var.census_secret_key}
    geography_relationship_pipeline:
      name: Neighborhood Digital Twin - Tract Relationship Pipeline
      description: Validates and transforms the official 2010-to-2020 tract relationship file.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: build_tract_relationship
          notebook_task:
            notebook_path: ./notebooks/03_transformation/02_build_tract_relationship.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              relationship_table: ${var.tract_relationship_table}
              quality_table: ${var.geography_quality_table}
    display_geometry_pipeline:
      name: Neighborhood Digital Twin - Display Geometry Pipeline
      description: Parses and validates simplified Census tract geometry for application maps.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: build_display_geometry
          notebook_task:
            notebook_path: ./notebooks/03_transformation/03_build_display_geometry.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              display_table: ${var.tract_display_geometry_table}
              quality_table: ${var.geography_quality_table}
          environment_key: geometry
      environments:
        - environment_key: geometry
          spec:
            environment_version: "2"
            dependencies:
              - pyshp==2.3.1
              - shapely==2.0.6
    canonical_geography_pipeline:
      name: Neighborhood Digital Twin - Canonical Geography Pipeline
      description: Builds the complete 2020 tract dimension with optional display geometry.
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: build_canonical_tracts
          notebook_task:
            notebook_path: ./notebooks/03_transformation/04_build_canonical_tracts.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table: ${var.canonical_tract_table}
              quality_table: ${var.canonical_quality_table}

targets:
  team:
    default: true
