# AI Assistance:
# OpenAI ChatGPT was used for code debugging, code generation, code/repo organization,
# and code methodological brainstorming. All final modeling, implementation,
# validation, commentary, and interpretation were performed and verified by the authors.
# Model used: GPT-5

command: ["streamlit", "run", "streamlit_app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: NEIGHBORHOOD_TWIN_DATA_MODE
    value: live
  - name: NEIGHBORHOOD_TWIN_CATALOG
    value: workspace
  - name: NEIGHBORHOOD_TWIN_GOLD_SCHEMA
    value: neighborhood_twin_gold
  - name: NEIGHBORHOOD_TWIN_SILVER_SCHEMA
    value: neighborhood_twin_silver
  - name: NEIGHBORHOOD_TWIN_SERVING_SCHEMA
    value: neighborhood_twin_serving
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"
