[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neighborhood-digital-twin"
version = "0.1.0"
description = "Public-data neighborhood forecasting, historical analogues, and scenario exploration."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = []
dependencies = [
  "numpy>=1.23.5,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
app = [
  "databricks-sdk>=0.40,<2",
  "databricks-sql-connector>=4,<5",
  "pandas>=2.1,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
]
dev = [
  "mypy",
  "pandas-stubs",
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
